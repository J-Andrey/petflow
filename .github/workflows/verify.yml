name: Verify PetFlow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Os testes injetam configuração sintética; nenhum .env operacional é usado.
env:
  NODE_ENV: test
  PETFLOW_ENV_FILE: .env.ci-unused

jobs:
  release-check:
    name: Release checks (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check syntax, tests, links and production dependencies
        run: npm run release:check

  postgres-integration:
    name: PostgreSQL 18 integration (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: petflow_test
          # Credencial pública, exclusiva deste container descartável.
          POSTGRES_PASSWORD: ci-only-local
          POSTGRES_DB: petflow_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petflow_test -d petflow_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Apply migrations and run integration tests on the empty database
        run: npm run test:integration
        env:
          TEST_DATABASE_NAME: petflow_test_ci
          TEST_DATABASE_URL: postgresql://petflow_test:ci-only-local@127.0.0.1:5432/petflow_test_ci
