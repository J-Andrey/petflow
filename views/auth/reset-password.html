<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>PetFlow | Redefinir senha</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/layout/public-header.css?v=20260811-1">
    <link rel="stylesheet" href="/css/pages/public-login.css?v=20260804-1">
</head>
<body>
    <main class="login-container">
        <section class="login-card" aria-labelledby="resetTitle">
            <header class="login-header">
                <a class="login-logo" href="/" aria-label="Voltar para a página inicial">
                    <img src="/images/logo/fred-petflow-logo-transparent.png" alt="Logo PetFlow" width="88" height="88">
                </a>
                <span class="login-eyebrow">Área do cliente</span>
                <h1 id="resetTitle">Crie uma nova senha</h1>
                <p>Informe uma nova senha para voltar a acessar sua conta PetFlow.</p>
            </header>

            <form id="publicResetPasswordForm" class="login-form" autocomplete="off">
                <input type="hidden" id="resetToken" name="token">
                <div class="form-group">
                    <label for="resetSenha">Nova senha</label>
                    <input class="form-control" type="password" id="resetSenha" name="senha" minlength="8" maxlength="72" required>
                </div>
                <div class="form-group">
                    <label for="resetSenhaConfirmacao">Confirmar senha</label>
                    <input class="form-control" type="password" id="resetSenhaConfirmacao" name="senhaConfirmacao" minlength="8" maxlength="72" required>
                </div>
                <button class="btn btn-primary" type="submit">
                    Salvar nova senha
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                <p class="login-note" id="resetStatus"></p>
            </form>
        </section>
    </main>

    <script src="/js/layout/public-header.js?v=20260811-1"></script>
    <script src="/js/pages/auth/public-auth.js?v=20260808-2"></script>
</body>
</html>
