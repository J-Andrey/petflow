<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>PetFlow | Meus pedidos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/layout/public-header.css?v=20260811-1">
    <link rel="stylesheet" href="/css/pages/public-login.css?v=20260808-1">
</head>
<body>
    <main class="login-container account-container orders-container">
        <section class="login-card" aria-labelledby="ordersTitle">
            <header class="login-header">
                <a class="login-logo" href="/" aria-label="Voltar para a página inicial">
                    <img src="/images/logo/fred-petflow-logo-transparent.png" alt="Logo PetFlow" width="88" height="88">
                </a>
                <span class="login-eyebrow">Área do cliente</span>
                <h1 id="ordersTitle">Meus pedidos</h1>
                <p>Acompanhe os pedidos feitos pela loja pública da PetFlow.</p>
            </header>

            <nav class="account-links" aria-label="Área do cliente">
                <a href="/conta"><i class="fa-solid fa-user-pen"></i> Minha conta</a>
                <a href="/meus-pets"><i class="fa-solid fa-paw"></i> Meus pets</a>
                <a class="active" href="/meus-pedidos"><i class="fa-solid fa-bag-shopping"></i> Meus pedidos</a>
            </nav>

            <div class="orders-list" id="publicOrdersList">
                <div class="orders-empty">Carregando seus pedidos...</div>
            </div>

            <p class="login-note" id="ordersStatus" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="/js/layout/public-header.js?v=20260811-1"></script>
    <script src="/js/pages/auth/public-auth.js?v=20261009-1"></script>
</body>
</html>
